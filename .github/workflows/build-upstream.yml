name: Build upstream binaries

# V6 (review finding): the TOS deb must not ship unauditable prebuilt binaries.
# This workflow builds Kavita from the upstream source tag, replicating the
# upstream release-workflow.yml build steps exactly (Node 24 + npm prod for the
# WebUI, monorepo-build.sh for dotnet publish), and re-packs the tarballs with
# a BUILD-INFO provenance file.
# Audit chain: upstream source tag + this workflow file + public Actions logs
# + SHA256SUMS shipped with the release.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Upstream Kavita tag to build (e.g. v0.9.1.4)'
        required: true
        default: 'v0.9.1.4'
      release_tag:
        description: 'Attach artifacts to this release tag (e.g. build-v0.9.1.4); empty = artifact only'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Kavita linux-x64 + linux-arm64 (self-contained .NET, from source)
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag }}
    steps:
      - name: Checkout upstream Kavita at ${{ github.event.inputs.tag }}
        uses: actions/checkout@v4
        with:
          repository: Kareadita/Kavita
          ref: ${{ github.event.inputs.tag }}
          persist-credentials: false

      - name: Record source commit
        run: echo "SRC_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      # ---- 以下步骤与上游 release-workflow.yml 逐字对齐（坑 32 规则 3）----
      - name: NodeJS to Compile WebUI
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: |
          cd UI/Web || exit
          echo 'Installing web dependencies'
          npm ci --legacy-peer-deps
          echo 'Building UI'
          npm run prod
          echo 'Copying back to Kavita wwwroot'
          rsync -a dist/ ../../Kavita.Server/wwwroot/
          cd ../ || exit

      - name: Compile dotnet app
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Install Swashbuckle CLI
        run: dotnet tool install -g Swashbuckle.AspNetCore.Cli
      - run: ./monorepo-build.sh

      # ---- 上游脚本产出 _output/kavita-{linux-x64,linux-arm,linux-arm64}.tar.gz；
      #      仅分发 x64/arm64 两个 TOS 需要的架构 ----
      - name: Inject BUILD-INFO + re-pack (x64/arm64 only)
        run: |
          set -e
          dotnet_sdk=$(dotnet --version)
          mkdir -p out
          for runtime in linux-x64 linux-arm64; do
            rm -rf repack && mkdir repack
            tar -xzf "_output/kavita-${runtime}.tar.gz" -C repack
            cat > repack/Kavita/BUILD-INFO <<EOF
          component=kavita
          version=${TAG#v}
          source_tag=${TAG}
          source_commit=${SRC_COMMIT}
          built_from=source
          dotnet_sdk=${dotnet_sdk}
          node=24
          built_by=github-actions
          workflow=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/main/.github/workflows/build-upstream.yml
          run_id=${GITHUB_RUN_ID}
          EOF
            ( cd repack && tar -czf "../out/kavita-${runtime}.tar.gz" Kavita )
            rm -rf repack
          done
          ( cd out && sha256sum kavita-*.tar.gz > SHA256SUMS && cat SHA256SUMS )

      - name: Sanity checks (ELF arch, binary runs)
        run: |
          set -e
          rm -rf chk && mkdir chk && tar -xzf out/kavita-linux-x64.tar.gz -C chk
          file chk/Kavita/Kavita | tee /dev/stderr | grep -q 'ELF 64-bit.*x86-64'
          file chk/Kavita/createdump | grep -q 'ELF 64-bit.*x86-64'
          test -f chk/Kavita/BUILD-INFO
          test -f chk/Kavita/wwwroot/index.html
          # 上游二进制无执行位是已知怪癖，安装包 stage 阶段会补 0755
          chmod +x chk/Kavita/Kavita
          ./chk/Kavita/Kavita --version || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kavita-source-build-${{ github.event.inputs.tag }}
          path: out/
          if-no-files-found: error

      - name: Attach to release (${{ github.event.inputs.release_tag }})
        if: github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: 'Source build of upstream ${{ github.event.inputs.tag }}'
          body: |
            Kavita binaries built from upstream source tag ${{ github.event.inputs.tag }}
            by [.github/workflows/build-upstream.yml](https://github.com/Moechz/kavita/blob/main/.github/workflows/build-upstream.yml).

            Build steps replicate the upstream release workflow (Node 24 WebUI build +
            monorepo-build.sh dotnet publish). Audit chain: upstream source tag →
            public workflow file → public Actions run ${{ github.run_id }} →
            SHA256SUMS below. Each tarball carries a top-level Kavita/BUILD-INFO
            provenance file (source tag/commit, SDK versions, run id).
          files: out/*
          prerelease: true
