<!DOCTYPE html>
<html lang="zh-cn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kavita Reading Server</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #101418; color: #d8dee6;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  }
  .card { text-align: center; }
  .book {
    width: 96px; height: 96px; margin: 0 auto 20px; border-radius: 50%;
    background: radial-gradient(circle at 34% 42%, #fff 0 12%, #4ac694 13% 62%, #3aa87c 63% 100%);
    box-shadow: 0 6px 30px rgba(74, 198, 148, .35);
    animation: breathe 3s ease-in-out infinite;
  }
  @keyframes breathe { 50% { transform: scale(1.08); } }
  a { color: #6fd7ae; }
</style>
</head>
<body>
  <div class="card">
    <div class="book"></div>
    <p>正在打开 Kavita（版本 @@VERSION@@）…</p>
    <p>若未自动跳转，请点击 <a href="/kavita/">/kavita/</a></p>
    <p style="margin-top:1.4rem;font-size:.85em;opacity:.75">
      <a href="/kavita/privacy-policy.html">Privacy Policy / 隐私政策</a>
    </p>
  </div>
  <script>location.replace('/kavita/');</script>
</body>
</html>
