# Kavita for TOS 7 - nginx reverse proxy (WebUI External Open / new-tab mode)
# Official template: help.terra-master.com -> Deb Development Specification -> Nginx Configuration
# Install location: /usr/local/kavita/nginx/kavita.conf
# The platform loads this into the TOS nginx; the location prefix must match config.ini's path
# Note: this keeps the /kavita/ prefix when forwarding (the navidrome approach) - Kavita runs
# natively under a sub-path via BaseUrl=/kavita/ (upstream Startup.UsePathBase plus the SPA
# <base href>), so the reader, API, OPDS and SignalR all stay consistent;
# do NOT write proxy_pass http://127.0.0.1:8500/ (a trailing slash strips the prefix,
# making the app receive unprefixed requests and the SPA assets 404)
# ★ ^~ 前缀匹配：优先级高于正则 location —— 必须带（pi-agent 侧实测，指南坑 65）。
# TOS「应用访问控制」会生成 `location ~ ^/<appid>/(.*) { auth_request …; try_files … =404; }`（正则、无反代），
# 按 nginx 顺序（= → ^~ → 正则 → 普通前缀）正则赢 → 本段反代永不被选中，应用表现为"只显示落地页/302→桌面/404"。
location ^~ /kavita/ {
    proxy_pass http://127.0.0.1:8500/kavita/;
    proxy_http_version 1.1;
    # Use $http_host for Host (includes the port): Kavita derives absolute URLs for OPDS feeds,
    # share links and emails from Host/X-Forwarded-*; $host (without the port) would produce broken links
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # WebSocket upgrade (reading progress / event streams / log panel use SignalR)
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    # Streaming book reads (PDF/EPUB pages fetched on demand) can take a while
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    # Management operations such as cover / theme CSS uploads
    client_max_body_size 128m;
}
# Redirect requests without a trailing slash (tolerance for hand-typed URLs)
# absolute_redirect off: emit a relative Location so the TOS nginx does not build an absolute URL
# without the port (observed to fall back to port 80 under port_in_redirect setups)
location = /kavita {
    absolute_redirect off;
    return 301 /kavita/;
}

# Privacy policy (review item C3): exact match wins over the prefix proxy and serves the static file
# from the install directory; bilingual (English first, Chinese below); the submission form carries the public repo URL, three-way reachable
location = /kavita/privacy-policy.html {
    alias /usr/local/kavita/privacy-policy.html;
}
