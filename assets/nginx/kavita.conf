# Kavita for TOS 7 — nginx 反代（WebUI External Open / 新标签页模式）
# 官方模板: help.terra-master.com → Deb Development Specification → Nginx Configuration
# 安装位置: /usr/local/kavita/nginx/kavita.conf
# 平台将其加载进 TOS nginx；location 前缀必须与 config.ini 的 path 一致
# 注意：此处保留 /kavita/ 前缀转发（navidrome 同款方案）——Kavita 以
# BaseUrl=/kavita/ 原生运行在子路径（上游 Startup.UsePathBase + SPA
# <base href> 均支持），阅读器/API/OPDS/SignalR 全部自洽；
# 不要写 proxy_pass http://127.0.0.1:8500/（尾斜杠会剥离前缀，
# 导致应用收到无前缀请求、SPA 资源 404）
location /kavita/ {
    proxy_pass http://127.0.0.1:8500/kavita/;
    proxy_http_version 1.1;
    # Host 用 $http_host（带端口）：Kavita 会依据 Host/X-Forwarded-* 生成
    # OPDS 订阅、分享与邮件里的绝对 URL，用 $host（不含端口）会生成丢端口的错误链接
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # WebSocket 升级（阅读进度/事件流/日志面板走 SignalR）
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    # 书籍流式读取（PDF/EPUB 页面按需拉取）可能耗时较长
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    # 封面/主题 CSS 上传等管理操作
    client_max_body_size 128m;
}
# 无尾斜杠访问补一个 301（用户手输地址的容错）
# absolute_redirect off: 输出相对 Location，避免 TOS nginx 构造绝对 URL 时
# 丢失端口（实测 port_in_redirect 环境下会踢到 80 端口）
location = /kavita {
    absolute_redirect off;
    return 301 /kavita/;
}

# 隐私政策（审核 C3）：精确匹配优先于前缀反代，直接从安装目录回静态文件；
# 双语（英前中后），提审表单里填公开仓库同源 URL，三处可达
location = /kavita/privacy-policy.html {
    alias /usr/local/kavita/privacy-policy.html;
}
